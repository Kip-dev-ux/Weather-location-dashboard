<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Client Booking System</title>
    <!-- This links your HTML to your styling sheet so we don't mix code -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="booking-container">
        <h2>Book a Consultation Slot</h2>
        <p>Please fill out the form below to lock in your booking.</p>

        <form id="bookingForm">
            <label for="client-name">Your Full Name:</label>
            <input type="text" id="client-name" name="name" placeholder="John Doe" required>

            <label for="client-email">Email Address:</label>
            <input type="email" id="client-email" name="email" placeholder="john@example.com" required>

            <label for="booking-date">Choose a Date:</label>
            <input type="date" id="booking-date" name="date" required>

            <button type="submit">Confirm Booking</button>
        </form>
    </div>

    <!-- This links your HTML to your logic file for when we add automation -->
    <script src="app.js"></script>
</body>
</html>
