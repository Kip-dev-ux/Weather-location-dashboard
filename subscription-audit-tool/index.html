<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Audit Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Subscription Audit</h1>

    <!-- Cost Summary -->
    <section class="summary-grid">
      <div class="stat-card">
        <span>Monthly Cost</span>
        <h2 id="monthlyTotal">KES 0</h2>
      </div>
      <div class="stat-card">
        <span>Annual Cost</span>
        <h2 id="annualTotal">KES 0</h2>
      </div>
    </section>

    <!-- Add Subscription Form -->
    <form id="subForm">
      <div class="field">
        <label for="subName">Service Name</label>
        <input type="text" id="subName" placeholder="e.g., Netflix, Spotify, Wi-Fi" required />
      </div>

      <div class="row">
        <div class="field">
          <label for="subCost">Monthly Cost (KES)</label>
          <input type="number" id="subCost" placeholder="e.g., 1100" min="1" required />
        </div>

        <div class="field">
          <label for="renewalDate">Next Renewal Date</label>
          <input type="date" id="renewalDate" required />
        </div>
      </div>

      <button type="submit" class="btn">Add Subscription</button>
    </form>

    <!-- Subscription List -->
    <h3>Active Subscriptions</h3>
    <ul id="subList" class="sub-list"></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
